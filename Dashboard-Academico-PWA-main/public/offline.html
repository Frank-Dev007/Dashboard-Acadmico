<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4F46E5" />
    <title>Sin conexión — Dashboard Académico</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #f9fafb;
        color: #111827;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card { max-width: 420px; width: 100%; text-align: center; }
      .icon {
        width: 96px; height: 96px; border-radius: 9999px;
        background: #fee2e2; display: inline-flex;
        align-items: center; justify-content: center; margin-bottom: 24px;
      }
      h1 { font-size: 22px; margin-bottom: 12px; }
      p { color: #6b7280; margin-bottom: 24px; line-height: 1.5; }
      button {
        width: 100%; padding: 12px 16px; border: none; border-radius: 8px;
        background: #4F46E5; color: #fff; font-size: 15px; cursor: pointer;
      }
      button:hover { background: #4338ca; }
      .hint { margin-top: 24px; font-size: 13px; color: #9ca3af; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 1l22 22" />
          <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55" />
          <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39" />
          <path d="M10.71 5.05A16 16 0 0 1 22.58 9" />
          <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88" />
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0" />
          <line x1="12" y1="20" x2="12.01" y2="20" />
        </svg>
      </div>
      <h1>Sin conexión a internet</h1>
      <p>No pudimos cargar esta página porque no hay conexión. Revisa tu red e intenta de nuevo. Algunos datos ya vistos pueden seguir disponibles dentro de la app.</p>
      <button onclick="window.location.reload()">Reintentar</button>
      <p class="hint">Dashboard Académico PWA — modo sin conexión</p>
    </div>
  </body>
</html>
